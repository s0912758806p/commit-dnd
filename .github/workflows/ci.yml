# 每次 push 到 main 與每個 PR 都跑 make ci（gofmt 檢查、go vet、go test -race）。
# Go 版本取自 go.mod，與本機最低需求一致。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make ci
