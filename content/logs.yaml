# 冒險日誌模板。可用的佔位符：{name} 寵物名、{species} 物種名、{xp} 獲得經驗、
# {lines} 改動行數、{level} 等級。同一類有多句時，用 commit hash 決定挑哪一句（重播結果不變）。
# dungeon 區塊另有：{floor} 樓層、{monster} 怪物名、{element} 屬性、{item} 裝備、
# {bag}／{bag_max} 背包數量、{lost} 遺失件數、{reason} 原因。

hatch: "蛋裂開了，{species}「{name}」誕生了！"
already_hatched: "已經有 {name} 了，蛋放回了倉庫。"
levelup: "{name} 升到了 Lv {level}！"
supply: "今天的補給到了，{name} 這次經驗加倍。"
hungry: "{name} 肚子餓得咕咕叫，這次只拿到一半經驗。"
pet: "你摸了摸 {name}，牠開心地蹭了蹭你。"
no_pet: "還沒有寵物。先用 dnd hatch 孵一隻吧。"

commit:
  feat:
    - "{name} 開拓了一條新通道，獲得 {xp} XP。"
    - "{name} 在牆上畫出新的地圖，獲得 {xp} XP。"
  fix:
    - "{name} 修好了一座搖搖欲墜的橋，獲得 {xp} XP。"
    - "{name} 拔掉了陷阱上的機關，獲得 {xp} XP。"
  test:
    - "{name} 對著稻草人反覆練習，獲得 {xp} XP。"
  refactor:
    - "{name} 把雜亂的背包重新整理了一遍，獲得 {xp} XP。"
  perf:
    - "{name} 找到一條更快的捷徑，獲得 {xp} XP。"
  docs:
    - "{name} 在冒險手冊上補了幾頁，獲得 {xp} XP。"
  revert:
    - "{name} 退回上一個岔路口，獲得 {xp} XP。"
  other:
    - "{name} 搬動了 {lines} 塊石頭，獲得 {xp} XP。"
    - "{name} 在營火旁整理裝備，獲得 {xp} XP。"

dungeon:
  descend: "{name} 下探到 B{floor}，遇到了 {monster}（{element}）。"
  encounter: "{name} 在 B{floor} 又遇到了 {monster}（{element}）。"
  boss: "{name} 來到 B{floor}，Boss {monster}（{element}）擋住了去路！"
  kill: "{name} 打倒了 {monster}。"
  boss_kill: "{name} 打倒了 Boss {monster}，B{floor} 的傳送點解鎖了！"
  drop: "{monster} 掉了一件未鑑定的裝備（背包 {bag}/{bag_max}）。"
  bag_full: "背包滿了，{monster} 掉的裝備只好留在原地。"
  downed: "{name} 在 B{floor} 被 {monster} 打倒了，{lost} 件未鑑定的裝備散落一地……"
  rescue: "commit 的光照進地城，{name} 在 B{floor} 重新站了起來！"
  identify_equip: "鑑定出 {item}，{name} 換上了它。"
  identify_skip: "鑑定出 {item}，比不上身上的裝備，拿去換了補給。"
  camp: "{name} 紮營睡了一覺，HP 回滿了。"
  warp: "{name} 透過傳送點來到 B{floor}。"
  warp_entrance: "{name} 回到了地城入口。"
  warp_denied: "無法傳送到 B{floor}：{reason}。"

# party 區塊（迭代 4）另有：{party}／{party_max} 隊伍人數、{dmg} 合體技傷害、{reason} 原因。
party:
  capture: "{name} 趁著修好陷阱的空檔，收服了 {monster}！"
  capture_fail: "{name} 想收服 {monster}，可惜被牠掙脫了。"
  capture_boss: "{monster} 是 Boss，收服不了。"
  join: "{monster} 加入了隊伍（{party}/{party_max}）。"
  full: "隊伍滿了，{monster} 先記在圖鑑裡（dnd party 可以調整）。"
  combo: "{name} 和 AI 夥伴使出合體技，對 {monster} 造成 {dmg} 點傷害！"
  remove: "{monster} 離開了隊伍（{party}/{party_max}）。"
  denied: "無法調整隊伍：{reason}。"
