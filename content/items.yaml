# 掉落裝備的名稱，依種類（weapon 武器、armor 防具）與屬性分組。
# 鑑定時（commit）用掉落時的種子挑出種類、屬性、名稱與強度；顯示為「名稱 +強度」。
# 武器強度加在攻擊，屬性相剋時傷害加成；防具強度加在防禦，屬性相剋時受到的傷害減少。

weapon:
  fire:  [焦土鍵盤, 熱修補短劍, 火焰圖分析杖]
  water: [冷卻液長槍, 串流法杖, 快取之刃]
  grass: [樹狀結構弓, 綠燈戰斧, 依賴圖長鞭]

armor:
  fire:  [防火牆鎧甲, 斷路器護腕]
  water: [沙盒護盾, 回滾斗篷]
  grass: [單元測試鎖子甲, 型別檢查頭盔]
