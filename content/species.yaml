# 可孵化的物種。id 寫進事件，改名字或圖不影響重播；刪掉 id 會讓舊存檔無法顯示。
# art 是第一階段（幼年）的 ASCII 圖，每行不超過 16 個半形字元。
# `|2` 固定去掉 4 格縮排（清單項目 2 格 + 2），圖的第一行才能比後面縮得多。

- id: slime
  name: 史萊姆
  art: |2
       .-""-.
      / o  o \
     |   ~~   |
      '------'

- id: drake
  name: 幼龍
  art: |2
      /\_/\  ,
     ( o.o )/
      > ^ <\
     /_/ \_\

- id: owl
  name: 貓頭鷹
  art: |2
      ,___,
      (O,O)
      /)_)
      """"

- id: knight
  name: 人類騎士
  art: |2
        _/^\_    |
       [ o o ]   |
        \_=_/  --+--
        /|#|\
        _/ \_
