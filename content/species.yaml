# 可孵化的物種（種族）。id 寫進事件，改 name 不影響重播。
# 不要刪除或改名已經用過的 id：舊存檔會找不到物種。要換 id 時，把舊 id 留在 aliases，
# 重播時舊事件會對應到新物種。

- id: human
  name: 人族
  aliases: [knight] # 舊物種「人類騎士」，2026-10-30 併入人族

- id: elf
  name: 精靈族

- id: orc
  name: 獸人族

- id: ratkin
  name: 鼠人族

- id: dwarf
  name: 矮人族

- id: undead
  name: 不死族

- id: demon
  name: 惡魔族

- id: dragonkin
  name: 龍人族
